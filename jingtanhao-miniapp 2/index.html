<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>京探号 · 小程序原型</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="desk-note">
    京探号小程序 · 交互原型<br>
    点击底部Tab切换页面 · AI掌柜可对话<br>
    <span style="opacity:.6">建议在手机模拟器或浏览器移动视图下体验</span>
  </div>

  <div class="phone-frame">

    <!-- 灵动岛 -->
    <div class="notch"></div>

    <!-- 状态栏 -->
    <div class="status-bar">
      <span class="time">9:41</span>
      <div class="status-icons">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1 0 10 10"/><path d="M12 6a6 6 0 1 0 6 6"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="7" width="15" height="10" rx="2.5"/><rect x="19" y="9" width="3" height="6" rx="1"/></svg>
      </div>
    </div>

    <!-- 主视图容器 -->
    <main class="app-main" id="appMain">
      <!-- 首页 -->
      <section class="view" id="view-home" data-view="home"></section>
      <!-- AI掌柜 -->
      <section class="view" id="view-ai" data-view="ai"></section>
      <!-- 路线 -->
      <section class="view" id="view-routes" data-view="routes"></section>
      <!-- 我的 -->
      <section class="view" id="view-mine" data-view="mine"></section>
    </main>

    <!-- 详情覆盖层 -->
    <div class="detail-overlay" id="detailOverlay"></div>

    <!-- 搜索覆盖层 -->
    <div class="search-overlay" id="searchOverlay">
      <div class="search-head">
        <div class="search-input">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="searchInput" placeholder="搜索老字号、内容、路线…" maxlength="30">
        </div>
        <button class="search-cancel" id="searchCancel">取消</button>
      </div>
      <div class="search-body" id="searchBody"></div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- 底部 Tab -->
    <nav class="tab-bar" id="tabBar">
      <button class="tab-item" data-tab="home">
        <span class="tab-icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
        首页
      </button>
      <button class="tab-item" data-tab="ai">
        <span class="tab-icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3z"/></svg></span>
        AI掌柜
      </button>
      <button class="tab-item" data-tab="routes">
        <span class="tab-icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg></span>
        路线
      </button>
      <button class="tab-item" data-tab="mine">
        <span class="tab-icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
        我的
      </button>
    </nav>

    <!-- Home 指示条 -->
    <div class="home-indicator"></div>

  </div>

  <script src="mock.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
