<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>京探号 · 小程序原型</title>
<style>
/* ============================================================
   京探号小程序 · 样式（设计令牌 + 组件规范）
   Design Contract 唯一来源，禁止各处自创颜色/字号
   ============================================================ */

:root {
  --primary: #8B2323;
  --primary-dark: #6B1A1A;
  --primary-light: #F5E8E8;
  --gold: #B8860B;
  --gold-light: #D4A017;
  --bg: #FAF6F0;
  --surface: #FFFFFF;
  --border: #E8E4DE;
  --text: #1A1A1A;
  --text-sub: #6B6B6B;
  --success: #4A7C59;
  --danger: #B3261E;
  --font-display: "Songti SC", "STSong", "SimSun", serif;
  --font-body: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --r-sm: 6px; --r-md: 10px; --r-lg: 16px;
  --shadow-sm: 0 1px 3px rgba(26, 26, 26, .06);
  --shadow-md: 0 6px 20px rgba(26, 26, 26, .08);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { height: 100%; }

body {
  font-family: var(--font-body);
  color: var(--text);
  background:
    radial-gradient(1200px 600px at 20% -10%, rgba(184,134,11,.10), transparent 60%),
    radial-gradient(1000px 700px at 90% 110%, rgba(139,35,35,.12), transparent 60%),
    linear-gradient(160deg, #1c1c1c 0%, #26211d 55%, #1a1715 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 24px;
}

/* ============ 手机框架 ============ */
.phone-frame {
  position: relative;
  width: 375px;
  height: 812px;
  background: var(--bg);
  border-radius: 46px;
  box-shadow:
    0 0 0 3px #3a3a3a,
    0 0 0 8px #111,
    0 30px 80px rgba(0,0,0,.6);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* 灵动岛 */
.notch {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  width: 118px;
  height: 34px;
  background: #0a0a0a;
  border-radius: 20px;
  z-index: 100;
}

.status-bar {
  height: 50px;
  padding: 0 26px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  padding-bottom: 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  flex-shrink: 0;
}
.status-bar .time { font-size: 15px; font-weight: 700; }
.status-icons { display: flex; gap: 5px; align-items: center; }
.status-icons svg { width: 16px; height: 16px; }

/* ============ 主视图容器 ============ */
.app-main {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.app-main::-webkit-scrollbar { display: none; }

.view { display: none; padding-bottom: 20px; }
.view.active { display: block; animation: viewIn .28s ease; }
@keyframes viewIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ============ 底部 Tab ============ */
.tab-bar {
  height: 68px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  flex-shrink: 0;
  padding-bottom: env(safe-area-inset-bottom);
}
.tab-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  color: #9a948a;
  cursor: pointer;
  border: none;
  background: none;
  font-family: var(--font-body);
  font-size: 11px;
  transition: color .2s;
}
.tab-item svg { width: 22px; height: 22px; }
.tab-item.active { color: var(--primary); font-weight: 600; }
.tab-item.active .tab-icon-wrap { background: var(--primary-light); }
.tab-icon-wrap {
  width: 38px; height: 26px;
  border-radius: 13px;
  display: flex; align-items: center; justify-content: center;
  transition: background .2s;
}

/* Home 指示条 */
.home-indicator {
  position: absolute;
  bottom: 6px;
  left: 50%;
  transform: translateX(-50%);
  width: 134px;
  height: 5px;
  background: #1a1a1a;
  border-radius: 3px;
  opacity: .85;
  z-index: 50;
}

/* ============ 通用组件 ============ */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  box-shadow: var(--shadow-sm);
}

.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: var(--r-md);
  padding: 10px 18px;
  font-size: 14px;
  font-weight: 600;
  font-family: var(--font-body);
  cursor: pointer;
  transition: transform .1s, background .2s, opacity .2s;
}
.btn-primary:active { transform: scale(.96); background: var(--primary-dark); }
.btn-primary:disabled { opacity: .5; }
.btn-ghost {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: var(--surface);
  color: var(--primary);
  border: 1px solid var(--primary);
  border-radius: var(--r-md);
  padding: 10px 18px;
  font-size: 14px;
  font-weight: 600;
  font-family: var(--font-body);
  cursor: pointer;
  transition: background .2s;
}
.btn-ghost:active { background: var(--primary-light); }

.tag {
  display: inline-block;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 999px;
  background: rgba(139,35,35,.08);
  color: var(--primary);
  font-weight: 500;
}
.tag.gold { background: rgba(184,134,11,.12); color: #8a6508; }
.tag.green { background: rgba(74,124,89,.12); color: var(--success); }

.section-title {
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 26px 16px 14px;
}
.section-title::before {
  content: "";
  width: 3px; height: 16px;
  background: var(--primary);
  border-radius: 2px;
}
.section-title .more {
  margin-left: auto;
  font-size: 12px;
  color: var(--text-sub);
  font-family: var(--font-body);
  font-weight: 400;
}

.empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-sub);
  font-size: 13px;
}
.empty svg { width: 40px; height: 40px; margin-bottom: 10px; opacity: .4; }

/* ============ 首页 ============ */
.home-head {
  padding: 14px 16px 8px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.logo {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
  color: var(--primary);
  letter-spacing: 1px;
  display: flex; align-items: center; gap: 6px;
  flex-shrink: 0;
}
.logo .excl {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px;
  background: var(--primary);
  color: #fff;
  border-radius: 6px;
  font-size: 15px;
  font-weight: 800;
}
.search-bar {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 8px 14px;
  color: var(--text-sub);
  font-size: 13px;
}
.search-bar svg { width: 15px; height: 15px; }

/* banner 轮播 */
.banner-wrap { padding: 12px 16px 4px; overflow: hidden; }
.banner-track { display: flex; transition: transform .4s ease; }
.banner {
  position: relative;
  height: 150px;
  width: 100%;
  flex-shrink: 0;
  border-radius: var(--r-lg);
  overflow: hidden;
  background: linear-gradient(135deg, var(--primary) 0%, #a03a2a 100%);
  background-size: cover;
  background-position: center;
  cursor: pointer;
}
.banner.photo .banner-deco { opacity: 0; }
.banner.photo::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,.5) 0%, transparent 60%);
}
.banner::after {
  content: "";
  position: absolute; inset: 0;
  background:
    radial-gradient(300px 120px at 85% 10%, rgba(255,255,255,.18), transparent),
    linear-gradient(135deg, rgba(0,0,0,0) 55%, rgba(0,0,0,.35));
}
.banner .banner-deco {
  position: absolute;
  right: -18px; bottom: -26px;
  font-family: var(--font-display);
  font-size: 92px;
  color: rgba(255,255,255,.14);
  font-weight: 800;
}
.banner .banner-text {
  position: absolute;
  left: 18px; bottom: 16px;
  z-index: 2;
  color: #fff;
}
.banner .banner-text h3 { font-family: var(--font-display); font-size: 20px; font-weight: 700; letter-spacing: 1px; }
.banner .banner-text p { font-size: 12px; opacity: .85; margin-top: 3px; }
.banner-dots {
  display: flex; gap: 5px;
  justify-content: center;
  margin-top: 8px;
}
.banner-dots i {
  width: 6px; height: 6px;
  border-radius: 3px;
  background: #d8d2c8;
  transition: all .3s;
}
.banner-dots i.on { width: 16px; background: var(--primary); }

/* 内容卡片流 */
.content-list { padding: 6px 16px 16px; }
.content-card {
  display: flex;
  gap: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 14px;
  cursor: pointer;
  transition: transform .15s;
  animation: cardIn .4s ease both;
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.content-card:active { transform: scale(.985); }
.cc-cover {
  width: 96px; height: 72px;
  border-radius: 8px;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg, #8a5a3a, #5a3a28);
  background-size: cover;
  background-position: center;
}
.cc-cover.gold { background: linear-gradient(135deg, #a97c2e, #7a5620); background-size: cover; background-position: center; }
.cc-cover.green { background: linear-gradient(135deg, #4a7c59, #33563e); background-size: cover; background-position: center; }
.cc-cover.photo::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,.38), transparent 55%);
}
.cc-cover.photo .cc-char { opacity: 0; }
.cc-cover .cc-char {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display);
  font-size: 26px;
  color: rgba(255,255,255,.85);
  font-weight: 700;
}
.cc-cover .cc-type {
  position: absolute;
  right: 6px; top: 6px;
  width: 22px; height: 22px;
  border-radius: 6px;
  background: rgba(0,0,0,.5);
  display: flex; align-items: center; justify-content: center;
  color: #fff;
  z-index: 2;
}
.cc-cover .cc-type svg { width: 12px; height: 12px; }
.cc-cover .cc-dur {
  position: absolute;
  right: 6px; bottom: 5px;
  font-size: 10px;
  color: rgba(255,255,255,.9);
  background: rgba(0,0,0,.4);
  padding: 1px 5px;
  border-radius: 4px;
  z-index: 2;
}
.cc-body { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 2px 0; }
.cc-body h4 {
  font-size: 14px;
  font-weight: 600;
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.cc-meta {
  display: flex; align-items: center; gap: 8px;
  font-size: 11px;
  color: var(--text-sub);
}
.cc-meta .plays { display: flex; align-items: center; gap: 3px; }
.cc-meta svg { width: 12px; height: 12px; }

/* 快捷入口 */
.quick-row {
  display: flex;
  gap: 12px;
  padding: 6px 16px 8px;
}
.quick-item {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 8px;
  text-align: center;
  cursor: pointer;
  transition: transform .15s;
}
.quick-item:active { transform: scale(.95); }
.quick-item .qi-icon {
  width: 38px; height: 38px;
  margin: 0 auto 6px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  color: #fff;
}
.quick-item .qi-icon svg { width: 19px; height: 19px; }
.quick-item p { font-size: 12px; font-weight: 600; }

/* ============ AI 掌柜页 ============ */
.ai-head {
  padding: 10px 16px 0;
}
.ai-title {
  font-family: var(--font-display);
  font-size: 19px;
  font-weight: 700;
  margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
}
.ai-title .spark { color: var(--gold); display: inline-flex; }
.ai-title .spark svg { width: 18px; height: 18px; }

.agent-scroll {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 4px 16px 10px;
  scrollbar-width: none;
}
.agent-scroll::-webkit-scrollbar { display: none; }
.agent-chip {
  flex-shrink: 0;
  display: flex; align-items: center; gap: 8px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 999px;
  padding: 6px 14px 6px 6px;
  cursor: pointer;
  transition: all .2s;
}
.agent-chip .avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: #fff;
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 700;
}
.agent-chip span { font-size: 13px; font-weight: 600; white-space: nowrap; }
.agent-chip.active {
  border-color: var(--primary);
  background: var(--primary-light);
}

.chat-wrap {
  padding: 10px 16px 4px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.msg { display: flex; gap: 8px; animation: msgIn .3s ease; }
@keyframes msgIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
.msg .avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  color: #fff;
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 700;
  margin-top: 2px;
}
.msg .bubble {
  max-width: 78%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  border-top-left-radius: 4px;
  padding: 10px 14px;
  font-size: 14px;
  line-height: 1.7;
}
.msg.user { flex-direction: row-reverse; }
.msg.user .bubble {
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 14px;
  border-top-right-radius: 4px;
}
.msg.typing .bubble {
  display: flex; gap: 4px; align-items: center;
  min-width: 44px;
}
.msg.typing i {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #c9c2b8;
  animation: blink 1s infinite;
}
.msg.typing i:nth-child(2) { animation-delay: .2s; }
.msg.typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%,80%,100% { opacity: .3; } 40% { opacity: 1; } }

.quick-prompts {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  padding: 10px 16px 4px;
}
.quick-prompts .prompt {
  font-size: 12px;
  color: var(--primary);
  background: var(--surface);
  border: 1px solid rgba(139,35,35,.3);
  border-radius: 999px;
  padding: 6px 12px;
  cursor: pointer;
  transition: background .2s;
}
.quick-prompts .prompt:active { background: var(--primary-light); }

.chat-input-row {
  display: flex;
  gap: 8px;
  padding: 10px 16px 6px;
  align-items: flex-end;
}
.chat-input-row input {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 11px 16px;
  font-size: 14px;
  font-family: var(--font-body);
  outline: none;
  transition: border-color .2s;
}
.chat-input-row input:focus { border-color: var(--primary); }
.chat-send {
  width: 42px; height: 42px;
  border-radius: 50%;
  background: var(--primary);
  border: none;
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: transform .1s, background .2s;
}
.chat-send:active { transform: scale(.92); background: var(--primary-dark); }
.chat-send:disabled { opacity: .5; }
.chat-send svg { width: 19px; height: 19px; }

/* ============ 路线页 ============ */
.route-list { padding: 6px 16px 16px; }
.route-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  margin-bottom: 16px;
  cursor: pointer;
  transition: transform .15s;
  animation: cardIn .4s ease both;
}
.route-card:active { transform: scale(.985); }
.route-cover {
  height: 96px;
  position: relative;
  background: linear-gradient(135deg, #8a5a3a, #5a3a28);
  background-size: cover;
  background-position: center;
}
.route-cover.gold { background: linear-gradient(135deg, #a97c2e, #7a5620); background-size: cover; background-position: center; }
.route-cover.green { background: linear-gradient(135deg, #4a7c59, #33563e); background-size: cover; background-position: center; }
.route-cover.photo::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,.4), transparent 50%);
}
.route-cover.photo .rc-char { opacity: 0; }
.route-cover .rc-char {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display);
  font-size: 34px;
  color: rgba(255,255,255,.8);
  font-weight: 700;
}
.route-cover .rc-tag {
  position: absolute;
  left: 10px; top: 10px;
  background: rgba(0,0,0,.5);
  color: #fff;
  font-size: 11px;
  padding: 3px 9px;
  border-radius: 999px;
  z-index: 2;
}
.route-cover .rc-dur {
  position: absolute;
  right: 10px; bottom: 10px;
  background: rgba(0,0,0,.5);
  color: #fff;
  font-size: 11px;
  padding: 3px 9px;
  border-radius: 999px;
  display: flex; align-items: center; gap: 4px;
  z-index: 2;
}
.route-cover .rc-dur svg { width: 11px; height: 11px; }
.route-body { padding: 12px 14px; }
.route-body h4 { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
.route-stats {
  display: flex; align-items: center; gap: 10px;
  font-size: 12px;
  color: var(--text-sub);
  margin-bottom: 8px;
}
.route-stats .rating { color: var(--gold); font-weight: 700; display: flex; align-items: center; gap: 3px; }
.route-stats .rating svg { width: 13px; height: 13px; }
.route-price-row {
  display: flex; align-items: center; justify-content: space-between;
}
.route-price { color: var(--primary); font-weight: 800; font-size: 16px; }
.route-price small { font-size: 12px; font-weight: 500; }
.route-join {
  font-size: 12px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 999px;
  padding: 6px 16px;
  font-weight: 600;
  cursor: pointer;
  font-family: var(--font-body);
}
.route-join:active { background: var(--primary-dark); }
.route-join:disabled { opacity: .5; }

/* ============ 详情覆盖层 ============ */
.detail-overlay {
  position: absolute;
  inset: 0;
  background: var(--bg);
  z-index: 80;
  display: none;
  flex-direction: column;
  animation: detailIn .3s ease;
}
.detail-overlay.open { display: flex; }
@keyframes detailIn {
  from { transform: translateX(100%); }
  to { transform: translateX(0); }
}
.detail-hero {
  height: 190px;
  position: relative;
  background: linear-gradient(135deg, var(--primary), #a03a2a);
  background-size: cover;
  background-position: center;
  flex-shrink: 0;
}
.detail-hero.gold { background: linear-gradient(135deg, #a97c2e, #7a5620); background-size: cover; background-position: center; }
.detail-hero.green { background: linear-gradient(135deg, #4a7c59, #33563e); background-size: cover; background-position: center; }
.detail-hero.photo::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,.25), transparent 40%, rgba(0,0,0,.15));
}
.detail-hero.photo .dh-char { opacity: 0; }
.detail-hero .dh-char {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display);
  font-size: 64px;
  color: rgba(255,255,255,.75);
  font-weight: 800;
}
.detail-back {
  position: absolute;
  left: 16px; top: 14px;
  width: 34px; height: 34px;
  border-radius: 50%;
  background: rgba(0,0,0,.4);
  color: #fff;
  border: none;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  z-index: 5;
}
.detail-back svg { width: 18px; height: 18px; }

          { id: 'b1', shopId: 'trt', title: '同仁堂知嘛健康零号店', sub: '350年药铺的新活法' },
          { id: 'b2', shopId: 'nls', title: '内联升×国潮联名', sub: '千层底布鞋成潮鞋' },
          { id: 'b3', shopId: 'wyt', title: '吴裕泰茶味冰淇淋', sub: '128年老茶庄的爆款' },
        ],
        contents: DB.contents,
        hotShops: DB.shops.slice(0, 4),
      },
    };
  },

  // GET /api/contents
  // 返回全部内容列表
  // TODO: replace with fetch('/api/contents')
  async fetchContents() {
    await delay(300);
    return { code: 0, data: DB.contents };
  },

  // GET /api/routes
  // 返回 City Walk 路线列表
  // TODO: replace with fetch('/api/routes')
  async fetchRoutes() {
    await delay(300);
    return { code: 0, data: DB.routes };
  },

  // GET /api/routes/:id
  // 返回路线详情
  // TODO: replace with fetch(`/api/routes/${id}`)
  async fetchRouteDetail(id) {
    await delay(250);
    return { code: 0, data: getRoute(id) };
  },

  // POST /api/ai/ask  { agentId, prompt }
  // 返回 AI 掌柜的回复（当前为关键词匹配的预设回复）
  // TODO: replace with real LLM call: fetch('/api/ai/ask', {method:'POST', body:{agentId, prompt}})
  async askAI(agentId, prompt) {
    await delay(700); // 模拟模型思考延迟，让 loading 可见
    const pool = DB.aiReplies.filter(r => r.agentId === agentId);
    const hit = pool.find(r => r.keywords.some(k => prompt.includes(k)));
    return { code: 0, data: { reply: hit ? hit.reply : DB.aiFallback } };
  },

  // POST /api/routes/:id/join  { seats }
  // 报名 City Walk；返回剩余名额（mock：最多报3人）
  // TODO: replace with fetch(`/api/routes/${id}/join`, {method:'POST'})
  async joinRoute(id, seats = 1) {
    await delay(500);
    const r = getRoute(id);
    if (!r) return { code: 1, msg: '路线不存在' };
    if (r.seats - seats < 0) return { code: 1, msg: '名额不足' };
    r.seats -= seats;
    r.joined += seats;
    return { code: 0, msg: '报名成功', data: { remaining: r.seats } };
  },
};

/* ---------------- 工具 ---------------- */
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toastEl.classList.remove('show'), 1800);
}
function loadFavorites() {
  try { state.favorites = JSON.parse(localStorage.getItem('jth_fav')) || []; } catch { state.favorites = []; }
}
function saveFavorites() {
  localStorage.setItem('jth_fav', JSON.stringify(state.favorites));
}
function toggleFav(key) {
  const i = state.favorites.indexOf(key);
  if (i >= 0) { state.favorites.splice(i, 1); showToast('已取消收藏'); }
  else { state.favorites.push(key); showToast('已收藏，去"我的"查看'); }
  saveFavorites();
}

/* ---------------- 详情覆盖层 ---------------- */
async function openRouteDetail(id) {
  const r = getRoute(id);
  if (!r) return;
  const shop = getShop(r.cover) || { name: r.name };

  // 体验官评价
  const reviews = (DB.routeReviews && DB.routeReviews[id]) || [];
  const reviewsHtml = reviews.length
    ? `<div class="section-title" style="margin-left:0">体验官评价</div>` + reviews.map(rev => `
        <div class="review-card">
          <div class="review-head">
            <span class="review-avatar">${esc(rev.avatar)}</span>
            <span class="rn">${esc(rev.name)}</span>
            <span class="review-stars">${[1,2,3,4,5].map(n => `<svg viewBox="0 0 24 24" fill="${n <= rev.rating ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.5" class="${n <= rev.rating ? '' : 'off'}"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`).join('')}</span>
          </div>
          <p class="review-text">${esc(rev.text)}</p>
        </div>`).join('')
    : '';

  // 相关路线（排除当前）
  const recRoutes = DB.routes.filter(x => x.id !== id).slice(0, 3);
  const recRoutesHtml = recRoutes.map(rec => `
    <div class="rec-route" data-route="${rec.id}">
      <div class="rr-cover" style="background-image:url('${rec.img}')"></div>
      <div class="rr-body">
        <h6>${esc(rec.name)}</h6>
        <span>¥${rec.price}/人</span>
      </div>
    </div>`).join('');

  overlay.innerHTML = `
    <div class="detail-hero ${coverClass(r.cover)} ${r.img ? 'photo' : ''}" style="${r.img ? `background-image:url('${r.img}')` : ''}">
      <span class="dh-char">${esc(r.name.charAt(0))}</span>
      <button class="detail-back" id="detailBack">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      </button>
    </div>
    <div class="detail-body">
      <h2>${esc(r.name)}</h2>
      <div class="route-stats">
        <span class="rating"><svg viewBox="0 0 24 24" fill="currentColor" width="13" height="13"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>${r.rating}</span>
        <span>${esc(r.duration)}</span>
        <span>已出发 ${r.joined} 人 · 余 ${r.seats} 席</span>
      </div>
      <p class="detail-desc">${esc(r.desc)}</p>
      <div class="section-title" style="margin-left:0">路线亮点</div>
      <div class="detail-spots">
        ${r.spots.map((s, i) => `<div class="detail-spot"><span class="ds-num">${i + 1}</span>${esc(s)}</div>`).join('')}
      </div>

      ${reviewsHtml}

      <div class="section-title" style="margin-left:0">相关路线</div>
      <div class="rec-route-row">${recRoutesHtml}</div>
    </div>
    <div class="detail-cta">
      <div class="dc-info">
        <div class="price">¥${r.price}<small style="font-size:12px;color:var(--text-sub)"> /人</small></div>
        <div class="sub">含讲解导览 · 体验物料 · 伴手礼</div>
      </div>
      <button class="btn-primary" id="detailJoin">立即报名</button>
    </div>
  `;
  overlay.classList.add('open');

  $('#detailBack').addEventListener('click', closeDetail);
  $('#detailJoin').addEventListener('click', async e => {
    e.stopPropagation();
    const btn = e.currentTarget;
    btn.disabled = true; btn.textContent = '报名中…';
    const res = await api.joinRoute(id);
    btn.disabled = false;
    if (res.code === 0) {
      showToast('报名成功！已为你保留席位');
      btn.textContent = '✓ 已报名';
      const r2 = getRoute(id);
      if (r2) { renderRoutes(); }
    } else {
      btn.textContent = '立即报名';
      showToast(res.msg);
    }
  });
}
function closeDetail() {
  overlay.classList.remove('open');
  overlay.innerHTML = '';
}

/* ---------------- 内容详情覆盖层 ---------------- */
function openContentDetail(id) {
  const c = getContent(id);
  if (!c) return;
  const shop = getShop(c.shopId) || { name: '老字号' };
  const isFav = state.favorites.includes(c.id);

  // 相关推荐：同店铺优先，其次其他内容
  const recs = DB.contents.filter(x => x.id !== c.id)
    .sort((a, b) => (b.shopId === c.shopId) - (a.shopId === c.shopId))
    .slice(0, 3);

  const recHtml = recs.map(rec => {
    const rs = getShop(rec.shopId);
    return `<div class="cd-rec-item" data-content="${rec.id}">
      <div class="cd-rec-cover" style="background-image:url('${rec.img}')"></div>
      <div class="cd-rec-body">
        <h5>${esc(rec.title)}</h5>
        <span>${esc(rs ? rs.name : '')} · ${esc(rec.duration)}</span>
      </div>
    </div>`;
  }).join('');

  const playIcon = c.type === 'video'
    ? '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/></svg>';

  overlay.innerHTML = `
    <div class="content-detail">
      <div class="cd-player" style="background-image:url('${c.img}')">
        <button class="cd-back" id="cdBack">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        </button>
        <div class="cd-play" id="cdPlay">${playIcon}</div>
        <div class="cd-progress"><i></i></div>
      </div>
      <div class="cd-body">
        <h2 class="cd-title">${esc(c.title)}</h2>
        <div class="cd-meta">
          <span class="tag ${c.type === 'audio' ? 'gold' : ''}">${c.type === 'video' ? '视频' : '音频'}</span>
          <span>${esc(shop.name)}</span>
          <span>${esc(c.plays)} 播放</span>
          <span>${esc(c.duration)}</span>
        </div>
        <p class="cd-desc">${esc(c.desc)}</p>
        <div class="section-title" style="margin-left:0">相关推荐</div>
        ${recHtml}
      </div>
      <div class="cd-cta">
        <button class="btn-ghost" id="cdFav" style="${isFav ? 'background:var(--primary-light)' : ''}">
          <svg viewBox="0 0 24 24" fill="${isFav ? '#B3261E' : 'none'}" stroke="${isFav ? '#B3261E' : 'currentColor'}" stroke-width="2" width="15" height="15"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
          ${isFav ? '已收藏' : '收藏'}
        </button>
        <button class="btn-primary" id="cdCheckin">去打卡</button>
      </div>
    </div>
  `;
  overlay.classList.add('open');

  $('#cdBack').addEventListener('click', closeDetail);
  $('#cdPlay').addEventListener('click', e => {
    e.stopPropagation();
    showToast(c.type === 'video' ? '视频播放：Demo 演示片段（占位）' : '音频播放：节目完整版（占位）');
  });
  $('#cdFav').addEventListener('click', () => {
    toggleFav(c.id);
    openContentDetail(c.id); // 重渲染收藏状态
  });
  $('#cdCheckin').addEventListener('click', () => {
    closeDetail();
    switchTab('routes');
    showToast('去「路线」报名，实地打卡吧！');
  });
}

}

function openMedia(type) {
  const isVideo = type === 'video';
  const list = DB.contents.filter(c => c.type === type);
  const rows = list.map((c, i) => {
    const shop = getShop(c.shopId);
    return `<div class="cd-rec-item" data-content="${c.id}" style="animation-delay:${i * 50}ms">
      <div class="cd-rec-cover" style="background-image:url('${c.img}')"></div>
      <div class="cd-rec-body">
        <h5>${esc(c.title)}</h5>
        <span>${esc(shop ? shop.name : '')} · ${esc(c.duration)} · ${esc(c.plays)}播放</span>
      </div>
    </div>`;
  }).join('');
  pageShell(isVideo ? '京探号·视频号' : '京探号·音频播客', isVideo ? `${list.length} 期视频` : `${list.length} 期音频`, `
    <p style="font-size:13px;color:var(--text-sub);line-height:1.8;margin-bottom:12px">
      ${isVideo
        ? '每期一家老字号，第一视角探店体验，大屏+网端同步播出。'
        : '每期20-30分钟深度对谈，讲透品牌故事与商业洞察，音频端同步上线。'}
    </p>
    ${rows}`);
}

/* 商务合作 */
function openBiz() {
  const b = DB.biz;
  pageShell('品牌内容合作', 'TO B', `
    <div class="biz-hero">
      <h3>${esc(b.title)}</h3>
      <div class="biz-price">${esc(b.price)} / 期</div>
      <p>${esc(b.desc)}</p>
    </div>
    <div class="section-title" style="margin-left:0">合作流程</div>
    <div class="biz-flow">
      ${b.flow.map((f, i) => `<div class="biz-step"><span class="bs-num">${i + 1}</span>${esc(f)}</div>`).join('')}
    </div>
    <div class="section-title" style="margin-left:0">联系我们</div>
    <div class="biz-contact">${esc(b.contact)}</div>`);
}

/* ---------------- 搜索覆盖层 ---------------- */
function openSearch() {
  $('#searchOverlay').classList.add('open');
  const input = $('#searchInput');
  input.value = '';
  input.focus();
  renderSearch('');
}
function closeSearch() {
  $('#searchOverlay').classList.remove('open');
}
function renderSearch(kw) {
  const body = $('#searchBody');
  const q = kw.trim().toLowerCase();
  if (!q) {
    body.innerHTML = `
      <div class="section-title" style="margin-left:0">热门搜索</div>
      <div class="search-hot">
        ${['同仁堂', '全聚德', '内联升', '吴裕泰', 'City Walk', '冰淇淋', '烤鸭', '布鞋'].map(h => `<span class="hot" data-hot="${esc(h)}">${esc(h)}</span>`).join('')}
      </div>
      <div class="section-title" style="margin-left:0">大家都在找</div>
      <div class="search-item" data-goto-ai>
        <div class="si-cover" style="background:linear-gradient(135deg,#8B2323,#c0392b)"><svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3z"/></svg></div>
        <div class="si-info"><h5>问问 AI 老掌柜</h5><p>同仁堂、全聚德、内联升三位掌柜在线答疑</p></div>
        <span class="si-tag">AI</span>
      </div>`;
    return;
  }

  // 内容匹配
  const cMatch = DB.contents.filter(c =>
    c.title.toLowerCase().includes(q) ||
    (getShop(c.shopId) && getShop(c.shopId).name.toLowerCase().includes(q)));
  // 路线匹配
  const rMatch = DB.routes.filter(r => r.name.toLowerCase().includes(q));
  // 店铺匹配
  const sMatch = DB.shops.filter(s => s.name.toLowerCase().includes(q) || s.tag.includes(kw));

  const item = (img, title, sub, tag, click) => `
    <div class="search-item" ${click}>
      <div class="si-cover" style="background-image:url('${img}')"></div>
      <div class="si-info"><h5>${esc(title)}</h5><p>${esc(sub)}</p></div>
      ${tag ? `<span class="si-tag">${tag}</span>` : ''}
    </div>`;

  let html = '';
  if (sMatch.length) {
    html += `<div class="search-group-title">老字号（${sMatch.length}）</div>` +
      sMatch.map(s => item(s.img, s.name, s.tag + ' · ' + s.sub, '店铺', `data-goto-ai`)).join('');
  }
  if (cMatch.length) {
    html += `<div class="search-group-title">内容（${cMatch.length}）</div>` +
      cMatch.map(c => item(c.img, c.title, (getShop(c.shopId) || {}).name + ' · ' + c.duration, c.type === 'video' ? '视频' : '音频', `data-content="${c.id}"`)).join('');
  }
  if (rMatch.length) {
    html += `<div class="search-group-title">路线（${rMatch.length}）</div>` +
      rMatch.map(r => item(r.img, r.name, '¥' + r.price + ' · ' + r.duration + ' · 已出发' + r.joined + '人', 'City Walk', `data-route="${r.id}"`)).join('');
  }
  if (!html) {
    html = `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><br>没有找到「${esc(kw)}」相关的内容<br>换个关键词试试，或去问问 AI 掌柜</div>`;
  }
  body.innerHTML = html;
}

/* ---------------- Tab 切换 ---------------- */
function switchTab(tab) {
  state.tab = tab;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  const el = $('#view-' + tab);
  if (el) el.classList.add('active');
  document.querySelectorAll('.tab-item').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  mainEl.scrollTop = 0;
  if (tab === 'ai') renderAI();
}

/* ---------------- 数据加载 + 首次渲染 ---------------- */
async function init() {
  loadFavorites();
  const { data } = await api.fetchHome();
  renderHome(data);
  renderRoutes();
  renderMine();
  renderAI();
  switchTab('home');
  bindGlobal();
  startBanner(data.banners.length);
  // 强制滚动到顶部（多重保险，防止浏览器恢复滚动位置）
  function forceTop() {
    mainEl.scrollTop = 0;
    window.scrollTo(0, 0);
    document.documentElement.scrollTop = 0;
    document.body.scrollTop = 0;
  }
  forceTop();
  setTimeout(forceTop, 0);
  setTimeout(forceTop, 100);
  setTimeout(forceTop, 300);
  setTimeout(forceTop, 600);
}

// 页面显示时也强制回顶（防止浏览器缓存滚动位置）
window.addEventListener('pageshow', () => {
  if (mainEl) mainEl.scrollTop = 0;
  window.scrollTo(0, 0);
});

/* ---------------- 全局事件绑定（事件委托） ---------------- */
function bindGlobal() {
  // Tab 切换
  tabBar.addEventListener('click', e => {
    const item = e.target.closest('.tab-item');
    if (item) switchTab(item.dataset.tab);
  });

  // 搜索栏点击 → 打开搜索
  mainEl.addEventListener('click', e => {
    if (e.target.closest('.search-bar')) openSearch();
  });

  // 搜索覆盖层事件
  const searchOverlay = $('#searchOverlay');
  const searchInput = $('#searchInput');
  searchInput.addEventListener('input', () => renderSearch(searchInput.value));
  $('#searchCancel').addEventListener('click', closeSearch);
  searchOverlay.addEventListener('click', e => {
    const hot = e.target.closest('.search-hot .hot');
    if (hot) { searchInput.value = hot.dataset.hot; renderSearch(hot.dataset.hot); return; }
    const sc = e.target.closest('[data-content]');
    if (sc) { closeSearch(); openContentDetail(sc.dataset.content); return; }
    const sr = e.target.closest('[data-route]');
    if (sr) { closeSearch(); openRouteDetail(sr.dataset.route); return; }
    const sai = e.target.closest('[data-goto-ai]');
    if (sai) { closeSearch(); switchTab('ai'); return; }
  });

  // 详情覆盖层内：相关路线 / 相关推荐 / 商品 / 去AI 点击（覆盖层不在主容器内，需单独委托）
  overlay.addEventListener('click', e => {
    const rr = e.target.closest('.rec-route');
    if (rr) { openRouteDetail(rr.dataset.route); return; }
    const cr = e.target.closest('.cd-rec-item');
    if (cr) { openContentDetail(cr.dataset.content); return; }
    const pr = e.target.closest('[data-product]');
    if (pr) { openProductDetail(pr.dataset.product); return; }
    const sai = e.target.closest('[data-goto-ai]');
    if (sai) { closeDetail(); switchTab('ai'); return; }
  });

  // 主容器事件委托
  mainEl.addEventListener('click', async e => {
    // 收藏
    const favBtn = e.target.closest('.fav-btn');
    if (favBtn) {
      e.stopPropagation();
      toggleFav(favBtn.dataset.fav);
      const tab = state.tab;
      if (tab === 'home') { const { data } = await api.fetchHome(); renderHome(data); }
      if (tab === 'routes') renderRoutes();
      return;
    }
    // 内容卡片 → 详情
    const contentCard = e.target.closest('[data-content]');
    if (contentCard && contentCard.dataset.content) {
      openContentDetail(contentCard.dataset.content);
      return;
    }
    // 路线卡片 → 详情
    const routeCard = e.target.closest('[data-route]');
    if (routeCard && routeCard.dataset.route) {
      openRouteDetail(routeCard.dataset.route);
      return;
    }
    // 立即报名
    const joinBtn = e.target.closest('[data-join]');
    if (joinBtn) {
      e.stopPropagation();
      const r = getRoute(joinBtn.dataset.join);
      if (r) openRouteDetail(r.id);
      return;
    }
    // 首页快捷入口 → AI
    const gotoAI = e.target.closest('[data-goto-ai]');
    if (gotoAI) { switchTab('ai'); return; }
    const gotoRoutes = e.target.closest('[data-goto-routes]');
    if (gotoRoutes) { switchTab('routes'); return; }
    // 首页四大快捷入口
    const goto = e.target.closest('[data-goto]');
    if (goto) {
      const k = goto.dataset.goto;
      if (k === 'ai') switchTab('ai');
      else if (k === 'routes') switchTab('routes');
      else if (k === 'mall') openMall();
      else if (k === 'community') openCommunity();
      else if (k === 'biz') openBiz();
      else if (k === 'orders') openOrders();
      else if (k === 'video') openMedia('video');
      else if (k === 'audio') openMedia('audio');
      else if (k === 'level') showToast('体验官等级：消费+打卡+分享赚积分升级');
      else if (k === 'setting') showToast('账号与设置（Demo 占位）');
      else if (k === 'fav') scrollToFav();
      else if (k === 'checkin') scrollToCheckin();
      return;
    }
    // banner → 去AI掌柜页
    const bannerEl = e.target.closest('[data-banner]');
    if (bannerEl) { switchTab('ai'); return; }
    // 我的收藏项 → 对应详情
    const favRoute = e.target.closest('.mine-list [data-route]');
    if (favRoute) { openRouteDetail(favRoute.dataset.route); return; }
  });

  // AI 掌柜页事件（渲染后绑定）
  document.addEventListener('click', async e => {
    // 掌柜角色切换
    const chip = e.target.closest('.agent-chip');
    if (chip) {
      state.aiAgentId = chip.dataset.agent;
      state.messages = [];
      renderAI();
      return;
    }
    // AI 能力标签
    const ability = e.target.closest('[data-ability]');
    if (ability) {
      showToast(`「${ability.dataset.ability}」功能演示中，敬请期待`);
      return;
    }
    // 语音输入
    const voice = e.target.closest('#chatVoice');
    if (voice) {
      showToast('语音输入开发中，先试试打字吧');
      return;
    }
    // 预设问题
    const prompt = e.target.closest('.prompt');
    if (prompt) {
      sendMessage(prompt.dataset.prompt);
      return;
    }
    // 发送按钮
    const send = e.target.closest('#chatSend');
    if (send) {
      const input = $('#chatInput');
      const text = input.value.trim();
      if (text) { input.value = ''; sendMessage(text); }
    }
  });

  // 输入框回车发送
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && state.tab === 'ai') {
      const input = $('#chatInput');
      if (input) {
        const text = input.value.trim();
        if (text) { input.value = ''; sendMessage(text); }
      }
    }
  });
}

/* ---------------- AI 对话 ---------------- */
async function sendMessage(text) {
  state.messages.push({ role: 'user', text });
  renderAI();
  // 显示 typing
  const chatWrap = $('#chatWrap');
  const typing = document.createElement('div');
  typing.className = 'msg agent typing';
  const agent = DB.aiAgents.find(a => a.id === state.aiAgentId);
  const shop = getShop(agent.shopId);
  typing.innerHTML = `<span class="avatar photo" style="background-image:url('${shop.img}')"></span><div class="bubble"><i></i><i></i><i></i></div>`;
  chatWrap.appendChild(typing);
  mainEl.scrollTop = mainEl.scrollHeight;

  const res = await api.askAI(state.aiAgentId, text);
  state.messages.push({ role: 'agent', text: res.data.reply });
  renderAI();
}

/* ---------------- Banner 轮播 ---------------- */
function startBanner(count) {
  if (count < 2) return;
  clearInterval(startBanner._t);
  startBanner._t = setInterval(() => {
    state.bannerIndex = (state.bannerIndex + 1) % count;
    const track = document.querySelector('.banner-track');
    const dots = document.querySelectorAll('.banner-dots i');
    if (!track) return;
    track.style.transition = 'transform .4s ease';
    track.style.transform = `translateX(-${state.bannerIndex * 100}%)`;
    dots.forEach((d, i) => d.classList.toggle('on', i === state.bannerIndex));
  }, 3500);
}

/* ---------------- 启动 ---------------- */
init();


</script>
